name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `skiff doctor` first and check the
        Troubleshooting section of the README; many issues are host setup.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get instead?
      placeholder: |
        $ skiff new dev --mem 2048
        ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `skiff doctor`
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: skiff version
      description: "Output of `go version -m $(command -v skiff) | grep -E 'mod|vcs.revision'`, or the commit hash you built from."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 26.1, Apple M4 Pro
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: Output of `container --version` (or `limactl --version` on the deprecated Lima backend).
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        For VM problems: `container machine logs <name>`; for port forwards
        `~/.skiff/relay.log`.
      render: shell
