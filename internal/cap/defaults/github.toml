# GitHub through the broker, for git and the gh CLI:
#   cracklet grant <vm> github
#
# Store a token once:
#   cracklet secret set github-token
# The token is the only limit on what the VM can reach: the broker checks
# that github is granted, not which repository a request names. Use a
# fine-grained token restricted to the repositories the agent should work on
# (Contents read/write for git, Pull requests for gh pr). The token itself
# never enters the guest.
#
# git: a managed section in the guest's /etc/gitconfig rewrites
# https://github.com/ and git@github.com: to the broker, so plain
# `git clone https://github.com/org/repo` and `git push` just work, also in
# sessions that were already open. Other settings in that file are left alone
# and `cracklet revoke` removes the section again.
#
# gh: http_unix_socket sends all of gh's API traffic to the broker socket in
# the guest, still addressed to api.github.com; the broker replaces gh's
# placeholder token (from hosts.yml) with the real one. Paths with
# percent-encoding are refused, and downloads that GitHub redirects to other
# hosts (gh release download) do not work through the broker.

name = "github"
description = "git and gh to GitHub, limited by the token's repositories"

[proxy]
upstream = "https://github.com"
[proxy.headers]
# git over HTTPS only accepts Basic auth; GitHub ignores the user name for
# tokens, x-access-token is the conventional one.
Authorization = "Basic {{ secret \"keychain:cracklet/github-token\" | basicauth \"x-access-token\" }}"

[[proxy.routes]]
host = "api.github.com"
upstream = "https://api.github.com"
[proxy.routes.headers]
Authorization = "Bearer {{ secret \"keychain:cracklet/github-token\" }}"

[[guest.blocks]]
path = "/etc/gitconfig"
content = """
[url "{{ .BrokerURL }}/github/"]
	insteadOf = https://github.com/
	insteadOf = git@github.com:
"""

[[guest.blocks]]
path = "/root/.config/gh/config.yml"
content = """
http_unix_socket: {{ .BrokerSocket }}
"""

# gh only talks to the API when it believes it is logged in. The placeholder
# lives in hosts.yml rather than GH_TOKEN because gh reads its files on every
# call, while a long-running process such as the Paseo daemon reads
# /etc/environment only at start and would miss a later grant. The shape is
# gh's multi-account format with a user name, so gh never migrates it (which
# would ask the API for the user and rewrite the file behind cracklet's back).
[[guest.blocks]]
path = "/root/.config/gh/hosts.yml"
content = """
github.com:
    users:
        cracklet:
            oauth_token: {{ .PseudoToken }}
    git_protocol: https
    user: cracklet
    oauth_token: {{ .PseudoToken }}
"""
