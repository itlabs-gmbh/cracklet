# Git over HTTPS to github.com through the broker. Scoped per repository:
#   cracklet grant <vm> github:itlabs-gmbh/cracklet
#   cracklet grant <vm> github:*
#
# Store a token once (a fine-grained token limited to the repos you grant is
# the safest choice):
#   cracklet secret set github-token
#
# A managed section in the guest's /etc/gitconfig rewrites https://github.com/
# and git@github.com: to the broker, so plain `git clone https://github.com/org/repo`
# and `git push` just work, also in sessions that were already open. Other
# settings in that file are left alone and `cracklet revoke` removes the
# section again.

name = "github"
description = "git over HTTPS to github.com, scoped per org/repo"

[proxy]
upstream = "https://github.com"
scope_segments = 2
[proxy.headers]
Authorization = "Bearer {{ secret \"keychain:cracklet/github-token\" }}"

[[guest.blocks]]
path = "/etc/gitconfig"
content = """
[url "{{ .BrokerURL }}/github/"]
	insteadOf = https://github.com/
	insteadOf = git@github.com:
"""
