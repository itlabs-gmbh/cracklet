name: Feature request
description: Propose a change or addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        cracklet deliberately stays small. Please describe the problem you are
        trying to solve rather than only the solution, so we can find the
        smallest change that fits.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that cracklet does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? Example commands or output are helpful.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other tools that solve this.
