# Git over HTTPS to github.com through the broker. Scoped per repository:
#   cracklet grant <vm> github:itlabs-gmbh/cracklet
#   cracklet grant <vm> github:*
#
# Store a token once (a fine-grained token limited to the repos you grant is
# the safest choice):
#   cracklet secret set github-token
#
# Git's GIT_CONFIG_* environment variables rewrite https://github.com/ and
# git@github.com: to the broker, so plain `git clone https://github.com/org/repo`
# and `git push` just work. Nothing in /etc/gitconfig is touched, and
# `cracklet revoke` removes the variables again.

name = "github"
description = "git over HTTPS to github.com, scoped per org/repo"

[proxy]
upstream = "https://github.com"
scope_segments = 2
[proxy.headers]
Authorization = "Bearer {{ secret \"keychain:cracklet/github-token\" }}"

[guest.env]
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "url.{{ .BrokerURL }}/github/.insteadOf"
GIT_CONFIG_VALUE_0 = "https://github.com/"
GIT_CONFIG_KEY_1 = "url.{{ .BrokerURL }}/github/.insteadOf"
GIT_CONFIG_VALUE_1 = "git@github.com:"
