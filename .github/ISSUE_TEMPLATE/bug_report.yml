name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `cracklet doctor` first and check the
        Troubleshooting section of the README; many issues are host setup.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you run, what did you expect, what did you get instead?
      placeholder: |
        $ cracklet new dev --mem 2048
        ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `cracklet doctor`
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cracklet version
      description: "Output of `go version -m $(command -v cracklet) | grep -E 'mod|vcs.revision'`, or the commit hash you built from."
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.3, Apple M3 Pro
    validations:
      required: true
  - type: input
    id: lima
    attributes:
      label: Lima version
      description: Output of `limactl --version`.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        For VM problems:
        `limactl shell cracklet sudo cat /var/lib/cracklet/vms/<name>/console.log`
        `limactl shell cracklet sudo journalctl -u cracklet-vm-<name>`
      render: shell
